<!-- options/options.html -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Kutipan | Save Clipboard</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background-color: #ffffff;
      color: #000000;
      margin: 20px;
      line-height: 1.4;
    }

    .container {
      max-width: 700px; 
      margin: 0 auto; 
    }

    .header { 
      border-bottom: 1px solid #000000;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 10px 0;
    }

    .actions {
      margin-bottom: 15px;
    }

    button { 
      padding: 5px 15px; 
      font-size: 12px;
      margin-right: 5px;
      cursor: pointer; 
      border: 1px solid #000000;
      background-color: #f0f0f0;
      font-family: inherit;
    }

    button:hover {
      background-color: #e0e0e0;
    }

    .quote-card { 
      border: 1px solid #000000; 
      padding: 10px; 
      margin: 15px 0; 
      background: #ffffff;
    }

    .quote-text { 
      font-size: 1rem;
      font-style: italic; 
      border-left: 3px solid #000000; 
      padding-left: 10px; 
      margin-bottom: 10px;
    }

    .meta { 
      font-size: 11px; 
      color: #333333; 
      background: #f5f5f5;
      padding: 5px 8px;
      border: 1px solid #cccccc;
    }

    .meta a {
      color: #0000ff;
      text-decoration: underline;
      word-break: break-all;
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      border: 1px dashed #999999;
      color: #666666;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>quotes</h1>
      <div class="actions">
        <button id="clearBtn">Hapus Semua</button>
        <button id="exportBtn">Save as MD</button>
      </div>
    </div>
    <div id="quoteList"></div>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
