<!-- options/options.html -->
<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard Kutipan | Save Clipboard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #ffffff;
        color: #000000;
        margin: 20px;
        line-height: 1.4;
      }

      .container {
        max-width: 700px;
        margin: 0 auto;
      }

      .header {
        border-bottom: 1px solid #000000;
        padding-bottom: 10px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 1.5rem;
        margin: 0 0 10px 0;
      }

      .actions {
        margin-bottom: 15px;
      }

      button {
        padding: 5px 15px;
        font-size: 12px;
        margin-right: 5px;
        cursor: pointer;
        border: 1px solid #000000;
        background-color: #f0f0f0;
        font-family: inherit;
      }

      button:hover {
        background-color: #e0e0e0;
      }

      .quote-card {
        border: 1px solid #000000;
        padding: 10px;
        margin: 15px 0;
        background: #ffffff;
      }

      .quote-text {
        font-size: 1rem;
        font-style: italic;
        border-left: 3px solid #000000;
        padding-left: 10px;
        margin-bottom: 10px;
      }

      .meta {
        font-size: 11px;
        color: #333333;
        background: #f5f5f5;
        padding: 5px 8px;
        border: 1px solid #cccccc;
      }

      .meta a {
        color: #0000ff;
        text-decoration: underline;
        word-break: break-all;
      }

      .empty-state {
        text-align: center;
        padding: 30px;
        border: 1px dashed #999999;
        color: #666666;
        margin: 20px 0;
      }
      /* Tambahan CSS Dashboard Analitik */
      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        margin-bottom: 25px;
      }
      .stat-card {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 6px;
        padding: 15px;
        text-align: center;
      }
      .stat-value {
        font-size: 1.5rem;
        font-weight: bold;
        color: #0056b3;
        margin: 10px 0 5px;
      }
      .stat-label {
        font-size: 12px;
        color: #6c757d;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>quotes</h1>
        <div class="actions">
          <button id="clearBtn">Hapus Semua</button>
          <button id="exportBtn">Save as MD</button>
          <!-- Tombol Baru -->
          <button id="copyMdBtn">Copy as MD</button>
        </div>
      </div>
      <!-- Modul Analitik Harian -->
      <div class="dashboard-grid" id="analyticsDashboard">
        <div class="stat-card">
          <div class="stat-label">Top Website</div>
          <div class="stat-value" id="statTopSite">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Upaya Distraksi</div>
          <div class="stat-value" id="statDistraction">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Rata-rata Tab</div>
          <div class="stat-value" id="statAvgTabs">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Jam Produktif</div>
          <div class="stat-value" id="statBestHour">-</div>
        </div>
      </div>
      <div id="quoteList"></div>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
