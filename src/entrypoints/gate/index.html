<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protected Site</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f1f5f9; color: #0f172a;
    }
    @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f8fafc; } }

    .card {
      width: min(420px, 100%); background: #fff; border-radius: 16px; padding: 28px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .12); text-align: center;
    }
    @media (prefers-color-scheme: dark) { .card { background: #1e293b; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); } }

    .shield {
      width: 58px; height: 58px; margin: 0 auto 14px; border-radius: 50%;
      background: rgba(59, 130, 246, .15); display: grid; place-items: center; font-size: 26px;
    }
    h1 { font-size: 18px; margin: 0 0 6px; }
    .site { font-weight: 700; word-break: break-all; }
    .muted { color: #64748b; font-size: 13px; margin: 0 0 18px; }
    @media (prefers-color-scheme: dark) { .muted { color: #94a3b8; } }

    form { display: flex; gap: 8px; }
    input {
      flex: 1; min-width: 0; padding: 11px 13px; font: inherit; border-radius: 9px;
      border: 1px solid #cbd5e1; background: #f8fafc; color: inherit;
    }
    @media (prefers-color-scheme: dark) { input { background: #0f172a; border-color: #334155; } }
    input:focus { outline: 2px solid rgba(59, 130, 246, .45); outline-offset: 1px; }
    button {
      padding: 11px 18px; font: inherit; font-weight: 600; border: none; border-radius: 9px;
      background: #2563eb; color: #fff; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: .5; cursor: wait; }

    .error { color: #dc2626; font-size: 13px; min-height: 20px; margin: 12px 0 0; }
    .ok { color: #059669; }
    footer { margin-top: 18px; font-size: 11.5px; color: #94a3b8; }
  </style>
</head>

<body>
  <div class="card">
    <div class="shield">🔒</div>
    <h1>Protected site</h1>
    <p class="site" id="siteName">-</p>
    <p class="muted">This link is on your whitelist. Enter the password to continue.</p>

    <form id="gateForm">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
      <button type="submit" id="submitBtn">Unlock</button>
    </form>
    <p class="error" id="message"></p>
    <footer id="footer">Password is checked by the extension, not by the website.</footer>
  </div>

  <script type="module" src="index.js"></script>
</body>

</html>
