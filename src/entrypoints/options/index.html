<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Dashboard | Focus & Clipboard</title>
  <style>
    /* ==========================================
         THEME SYSTEM: CSS CUSTOM PROPERTIES
         ========================================== */
    :root {
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #334155;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --card-shadow:
        0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    /* Dark theme injection (auto-detects the user OS) */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: #0f172a;
        --bg-card: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #334155;
        --primary: #60a5fa;
        --primary-hover: #3b82f6;
        --danger: #f87171;
        --danger-hover: #ef4444;
        --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
      }
    }

    /* ==========================================
         GLOBAL STYLES & LAYOUTING
         ========================================== */
    body {
      font-family:
        system-ui,
        -apple-system,
        sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      padding: 30px;
      line-height: 1.6;
      transition:
        background-color 0.3s ease,
        color 0.3s ease;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      color: var(--text-main);
    }

    h3 {
      color: var(--text-main);
      margin-top: 0;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    /* ==========================================
         BUTTON COMPONENTS
         ========================================== */
    button {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      /* Softer/rounder */
      background-color: var(--primary);
      color: #ffffff;
      margin-left: 8px;
      transition:
        background-color 0.2s,
        transform 0.1s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    #clearBtn {
      background-color: var(--danger);
    }

    #clearBtn:hover {
      background-color: var(--danger-hover);
    }

    /* Special button for the "See More" feature */
    button.btn-toggle-text {
      background: none;
      color: var(--primary);
      padding: 0;
      margin: 8px 0 0 0;
      font-size: 13px;
      border-radius: 0;
    }

    button.btn-toggle-text:hover {
      background: none;
      text-decoration: underline;
    }

    /* ==========================================
         DATA CARDS & GRIDS
         ========================================== */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card,
    .domain-list-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--card-shadow);
      transition:
        background-color 0.3s,
        border-color 0.3s;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-value.danger {
      color: var(--danger);
    }

    .ranking-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 250px;
      overflow-y: auto;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px dashed var(--border-color);
      font-size: 14px;
    }

    .ranking-item:last-child {
      border-bottom: none;
    }

    .domain-name {
      font-weight: 500;
      color: var(--text-main);
    }

    .domain-time {
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      font-family: monospace;
    }

    /* ==========================================
         TIMEFRAME FILTER PILLS
         ========================================== */
    .filter-pills {
      display: flex;
      gap: 8px;
      background: var(--bg-card);
      padding: 6px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      box-shadow: var(--card-shadow);
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .timeframe-filter-btn {
      flex: 1;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 0;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .timeframe-filter-btn:hover {
      color: var(--text-main);
      background-color: var(--border-color);
    }

    .timeframe-filter-btn.active {
      background-color: var(--primary);
      color: #ffffff;
    }

    /* ==========================================
         QUOTES LIST COMPONENT
         ========================================== */
    .quote-card {
      border-left: 4px solid var(--primary);
      padding: 16px;
      margin-bottom: 16px;
      background: var(--bg-card);
      border-radius: 0 12px 12px 0;
      box-shadow: var(--card-shadow);
      border-top: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }

    .quote-text-wrapper {
      margin-bottom: 12px;
    }

    .quote-text {
      font-size: 15px;
      font-family: monospace;
      /* Suitable for code snippets */
      color: var(--text-main);
      white-space: pre-wrap;
      /* Preserves code line breaks */
      word-break: break-word;
    }

    /* Utility class for CSS text clamping */
    .quote-text.clamped {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      /* Max 4 visible lines */
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta {
      font-size: 12px;
      color: var(--text-muted);
      padding-top: 8px;
      border-top: 1px dashed var(--border-color);
    }

    .meta a {
      color: var(--primary);
      text-decoration: none;
      word-break: break-all;
    }

    .meta a:hover {
      text-decoration: underline;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      border: 2px dashed var(--border-color);
      color: var(--text-muted);
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="stat-card" style="margin-bottom: 25px;">
      <h3>Setting Pomodoro Character</h3>
      <div style="display: flex; gap: 20px; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 15px;">
          <img id="pomoPreviewImg" src="../../assets/kucing.gif"
            style="display: block; object-fit: contain; width: 120px; min-height: 50px; transition: width 0.2s ease;"
            alt="Character Preview">
          <div>
            <label class="stat-label">Character Size</label>
            <input type="range" id="pomoSizeSlider" min="50" max="300" value="120" style="width: 100%;">
          </div>
          <div>
            <label class="stat-label">Default Motivational Message</label>
            <input type="text" id="pomoDefaultText" placeholder="Example: stay focused"
              style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); box-sizing: border-box; font-family: monospace;">
          </div>
          <div style="text-align: right; margin-top: auto;">
            <button id="savePomoBtn" style="background-color: var(--primary); padding: 10px 25px;">
              💾 Save Settings
            </button>
          </div>
        </div>

        <div
          style="flex: 1; min-width: 300px; background: var(--bg-body); border: 2px dashed var(--border-color); border-radius: 12px; position: relative; min-height: 250px; display: flex; align-items: flex-end; justify-content: flex-end; padding: 30px; overflow: hidden;">
          <div
            style="position: absolute; top: 15px; left: 15px; font-size: 12px; color: var(--text-muted); font-weight: bold; letter-spacing: 1px;">
            🔴 LIVE PREVIEW</div>

          <div style="display: flex; flex-direction: column; align-items: center;">
            <div
              style="position: relative; background: white; padding: 10px 15px; border: 4px solid black; margin-bottom: 12px; font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 14px; color: black; box-shadow: 4px 4px 0px rgba(0,0,0,0.2); max-width: 200px; word-wrap: break-word; text-align: center;">
              <span id="pomoPreviewText" style="line-height: 1.4;">stay focused<br>25:00 left</span>
              <div
                style="position: absolute; bottom: -12px; right: 20px; width: 8px; height: 8px; background: white; border-left: 4px solid black; border-right: 4px solid black; box-shadow: 0 4px 0 black;">
              </div>
            </div>
            <img id="pomoPreviewImg"
              style="display: block; object-fit: contain; width: 120px; min-height: 50px; transition: width 0.2s ease;"
              alt="Character Preview">
          </div>
        </div>
      </div>
    </div>
    <div class="header">
      <h1>Analytics Dashboard</h1>
      <div class="actions">
        <button id="clearBtn">Clear Data</button>
        <button id="exportBtn">Export .md</button>
        <button id="copyMdBtn">Copy to Clipboard</button>
      </div>
    </div>

    <!-- Period Filter (Pills) -->
    <div class="filter-pills">
      <button class="timeframe-filter-btn active" data-filter="today">Today</button>
      <button class="timeframe-filter-btn" data-filter="week">Weekly (7 Days)</button>
      <button class="timeframe-filter-btn" data-filter="month">Monthly</button>
      <button class="timeframe-filter-btn" data-filter="year">Yearly</button>
      <button class="timeframe-filter-btn" data-filter="all">All Time</button>
    </div>

    <div class="dashboard-grid">
      <div class="stat-card">
        <div class="stat-label" id="statTimeframeLabel">Internet Time (Today)</div>
        <div class="stat-value" id="statTodayTime">0h 0m</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Usage</div>
        <div class="stat-value" id="statAllTime">0h 0m</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Distraction Attempts</div>
        <div class="stat-value danger" id="statDistractions">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">📂 Tabs Opened</div>
        <div class="stat-value" id="statTabsOpened">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">📁 Tabs Closed</div>
        <div class="stat-value danger" id="statTabsClosed">0</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; margin-bottom: 25px;">
      <div class="domain-list-container">
        <h3>Time Distribution</h3>
        <div id="analyticsChartContainer"></div>
      </div>
      <div class="domain-list-container">
        <h3>Domain Allocation</h3>
        <ul id="domainRanking" class="ranking-list"></ul>
      </div>
    </div>

    <div class="quotes-section">
      <h3>Quotes & Code Snippets</h3>
      <div id="quoteList"></div>

      <div id="seeMoreQuotesContainer" style="text-align: center; margin-top: 20px; display: none">
        <button id="btnSeeAllQuotes" style="
              background-color: var(--bg-card);
              color: var(--primary);
              border: 1px solid var(--primary);
              width: 100%;
              padding: 12px;
            ">
          Show All Quotes ▼
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="index.js"></script>
</body>

</html>
