<!doctype html>
<html>

<head>
  <style>
    body {
      font-family:
        system-ui,
        -apple-system,
        sans-serif;
      width: 250px;
      padding: 16px;
      color: #333;
    }

    .row {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0;
    }

    input[type="number"],
    textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: monospace;
    }

    textarea {
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #0056b3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 8px;
    }

    button:hover {
      background-color: #004494;
    }

    .btn-success {
      background-color: #198754;
    }

    .btn-success:hover {
      background-color: #157347;
    }

    hr {
      border: 0;
      border-top: 1px solid #eaeaea;
      margin: 16px 0;
    }
  </style>
</head>

<body>
  <div class="row">
    <label class="checkbox-label">
      <input type="checkbox" id="enabled" />
      Aktifkan Mode Fokus
    </label>
  </div>

  <div class="row">
    <label class="checkbox-label">
      <input type="checkbox" id="cleanerEnabled" />
      Aktifkan Link Cleaner (Hapus Tracker)
    </label>
  </div>

  <div class="row">
    <label for="maxTabs">Batas Maksimal Tab</label>
    <input type="number" id="maxTabs" min="1" />
  </div>

  <div class="row">
    <label for="blockedSites">Blokir Situs (pisahkan dengan koma atau baris baru)</label>
    <textarea id="blockedSites" rows="4" placeholder="facebook.com&#10;twitter.com"></textarea>
  </div>

  <hr>
  <div class="row">
    <label class="checkbox-label">
      <input type="checkbox" id="darkEnabled" />
      Aktifkan Dark Mode
    </label>
  </div>

  <div class="row">
    <label for="darkExcluded">Pengecualian Dark Mode (Website Terang)</label>
    <textarea id="darkExcluded" rows="3" placeholder="youtube.com&#10;github.com"></textarea>
  </div>
  <hr>
  <div class="row" style="margin-bottom: 12px;">
    <label>Responsive Tester (Buka di Window Baru)</label>
    <div id="responsiveTesterContainer" style="display: flex; gap: 6px; margin-top: 6px;">
      <button data-device="mobile" style="margin: 0; background-color: #6366f1; padding: 8px 4px; font-size: 11px;">
        Mobile</button>
      <button data-device="tablet" style="margin: 0; background-color: #8b5cf6; padding: 8px 4px; font-size: 11px;">
        Tablet</button>
      <button data-device="desktop" style="margin: 0; background-color: #a855f7; padding: 8px 4px; font-size: 11px;">
        Desktop</button>
    </div>
  </div>
  <hr>
  <div class="row"
    style="text-align: center; background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #ccc;">
    <h4 style="margin: 0 0 5px 0; font-size: 14px;" id="pomoStatus">💤 Pomodoro Nonaktif</h4>
    <h2 style="margin: 0 0 12px 0; font-family: monospace; font-size: 32px;" id="pomoTimer">25:00</h2>

    <button id="startPomoBtn" class="btn-success" style="margin-bottom: 0;">Mulai Fokus</button>
    <button id="stopPomoBtn" style="background-color: #dc3545; display: none; margin-bottom: 0;">Berhenti</button>
  </div>
  <hr>
  <button id="saveBtn">Simpan Pengaturan</button>

  <button id="copyMdBtn" class="btn-success">Copy Blog as .md</button>

  <button id="pasteHtmlBtn" class="btn-secondary" style="background-color: #0dcaf0; color: #000; margin-top: 8px">
    Paste Code as .html
  </button>

  <button id="copyLinksBtn" class="btn-secondary" style="background-color: #6f42c1; color: white; margin-top: 8px">
    Copy Semua Link
  </button>

  <button id="openDashboardBtn" class="btn-secondary" style="background-color: #6c757d; color: white; margin-top: 8px">
    Buka Dashboard Kutipan
  </button>

  <script type="module" src="index.js"></script>
</body>

</html>
