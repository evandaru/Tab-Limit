<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: Arial;
        width: 220px;
        padding: 15px;
      }

      .row {
        margin-bottom: 12px;
      }

      input[type="number"] {
        width: 100%;
        padding: 6px;
        box-sizing: border-box;
      }

      button {
        width: 100%;
        padding: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <label>
        <input type="checkbox" id="enabled" />
        Aktifkan Tab Limiter
      </label>
    </div>

    <div class="row">
      <label>Maksimal Tab</label>
      <input type="number" id="maxTabs" min="1" />
    </div>

    <button id="saveBtn">Simpan</button>

    <script src="popup.js"></script>
  </body>
</html>
