<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        width: 250px;
        padding: 16px;
        color: #333;
      }
      .row {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
        font-weight: 500;
      }
      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 0;
      }
      input[type="number"], textarea {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-family: monospace;
      }
      textarea {
        resize: vertical;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #0056b3;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      button:hover {
        background-color: #004494;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <label class="checkbox-label">
        <input type="checkbox" id="enabled" />
        Aktifkan Mode Fokus
      </label>
    </div>

    <div class="row">
      <label for="maxTabs">Batas Maksimal Tab</label>
      <input type="number" id="maxTabs" min="1" />
    </div>

    <div class="row">
      <label for="blockedSites">Blokir Situs (pisahkan dengan koma atau baris baru)</label>
      <textarea id="blockedSites" rows="4" placeholder="facebook.com&#10;twitter.com"></textarea>
    </div>

    <button id="saveBtn">Simpan Pengaturan</button>

    <script src="popup.js"></script>
  </body>
</html>
